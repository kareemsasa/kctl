[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kctl"
version = "0.1.0"
description = "Local control plane for Codex-driven development workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
kctl = "kctl_pkg:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["kctl_pkg"]
