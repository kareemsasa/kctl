[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kctl"
version = "0.1.0"
description = "Local control plane for Codex-driven development workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "pytest>=9.0.3",
]

[project.scripts]
kctl = "kctl_pkg:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["kctl_pkg"]
omit = [
  "*/tests/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.setuptools]
packages = ["kctl_pkg"]
